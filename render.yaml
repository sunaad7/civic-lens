services:
  - type: web
    name: civic-lens-api
    runtime: node
    rootDir: api
    # --include=dev so tsc + tsx (migrations) are available despite NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SAMESITE
        value: none
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: stub
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: complaint-images
